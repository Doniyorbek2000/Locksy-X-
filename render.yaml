services:
  - type: web
    name: locksy-x-backend
    env: node
    plan: free
    region: frankfurt
    # Root directory for this service
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: locksy-db
          property: connectionString

databases:
  - name: locksy-db
    plan: free
    region: frankfurt
